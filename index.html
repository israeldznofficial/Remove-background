<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Remover Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="background-decor"></div>

    <div class="container">
        <header>
            <div class="logo-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
            <h1>BG Remover</h1>
            <p>הסרת רקע מתמונות בלחיצת כפתור אחת</p>
        </header>

        <main class="upload-section">
            <div class="drop-zone" id="dropZone">
                <input type="file" id="imageInput" accept="image/*" hidden>
                <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                <p class="drop-title">גרור תמונה לכאן או <span class="highlight">לחץ לבחירה</span></p>
                <p class="drop-sub">תומך ב-PNG, JPG, WEBP</p>
            </div>

            <div class="preview-container">
                <div class="image-box">
                    <span class="badge">מקור</span>
                    <img id="originalImage" src="" alt="תמונה מקורית" style="display:none;">
                    <div class="placeholder-text" id="origPlaceholder">
                        <i class="fa-regular fa-image"></i>
                        <p>התמונה המקורית תופיע כאן</p>
                    </div>
                </div>

                <div class="image-box result-box">
                    <span class="badge badge-success">תוצאה</span>
                    <div id="loader" class="loader-wrapper" style="display:none;">
                        <div class="spinner"></div>
                        <p>מעבד את התמונה...</p>
                    </div>
                    <img id="resultImage" src="" alt="תוצאה" style="display:none;">
                    <div class="placeholder-text" id="resultPlaceholder">
                        <i class="fa-solid fa-sparkles"></i>
                        <p>התוצאה ללא הרקע תופיע כאן</p>
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="removeBtn" class="btn btn-primary" disabled>
                    <i class="fa-solid fa-scissors"></i> הסר רקע
                </button>
                <a id="downloadBtn" class="btn btn-success" style="display:none;">
                    <i class="fa-solid fa-download"></i> הורד תמונה
                </a>
                <button id="copyBtn" class="btn btn-secondary" style="display:none;">
                    <i class="fa-regular fa-copy"></i> העתק ללוח
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
